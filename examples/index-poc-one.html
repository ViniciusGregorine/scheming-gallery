<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Art Gallery — Box Model & Flexbox</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #e8e8e8;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      padding: 28px 20px 10px;
      text-align: center;
    }
    header h1 { font-size: 1.6rem; color: #222; }
    header p  { font-size: 0.85rem; color: #666; margin-top: 4px; }

    /* ══════════════════════════════════════════
       FLEXBOX CONTAINER
       display:flex  |  flex-wrap:wrap  |  justify-content:center
    ══════════════════════════════════════════ */
    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 0;                  /* gap handled by margin on each frame */
      padding: 40px 20px;
      width: 100%;
    }

    /* ══════════════════════════════════════════
       BOX MODEL WRAPPER
       Shows the 4 layers with visible labels
    ══════════════════════════════════════════ */
    .box-model-wrapper {
      position: relative;
      display: inline-block;
    }

    /* MARGIN BOX label */
    .label-margin {
      position: absolute;
      top: 4px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.72rem;
      font-weight: bold;
      color: #333;
      white-space: nowrap;
      z-index: 10;
    }

    /* ── MARGIN layer ── */
    .frame-margin {
      margin: 28px;            /* 🟡 MARGIN — space outside the border */
      background: transparent;
      position: relative;
    }

    /* BORDER BOX label */
    .label-border {
      position: absolute;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.72rem;
      font-weight: bold;
      color: #fff;
      white-space: nowrap;
      z-index: 10;
    }

    /* ── BORDER layer ── */
    .frame-border {
      border: 28px solid #222; /* 🟤 BORDER — the picture frame */
      position: relative;
      background: #fff;
    }

    /* Highlighted center frame uses blue border */
    .frame-border.highlight {
      border-color: #1a6ef5;
    }

    /* PADDING BOX label */
    .label-padding {
      position: absolute;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.72rem;
      font-weight: bold;
      color: #333;
      white-space: nowrap;
      z-index: 10;
    }

    /* ── PADDING layer ── */
    .frame-padding {
      padding: 22px;           /* 🔵 PADDING — the inner mat */
      background: #fff;
      position: relative;
    }

    /* Highlighted center uses light-blue padding */
    .frame-padding.highlight {
      background: #a8d0f5;
    }

    /* CONTENT BOX label */
    .label-content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 0.72rem;
      font-weight: bold;
      color: #222;
      background: rgba(255,255,255,0.85);
      padding: 4px 10px;
      border: 1px solid #aaa;
      white-space: nowrap;
      z-index: 10;
      pointer-events: none;
    }

    /* ── CONTENT layer — the painting ── */
    .frame-content {
      position: relative;
      width: 220px;
      height: 300px;
      overflow: hidden;
    }

    .frame-content img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ── Caption ── */
    .caption {
      background: #fff;
      padding: 8px 10px 10px;
      border-top: 1px solid #ddd;
      text-align: center;
    }
    .caption h3 { font-size: 0.8rem; color: #222; }
    .caption p  { font-size: 0.68rem; color: #888; margin-top: 2px; }

    /* ══════════════════════════════════════════
       LEGEND — also uses Flexbox
    ══════════════════════════════════════════ */
    .legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 20px 30px 30px;
      width: 100%;
      background: #d8d8d8;
      border-top: 1px solid #bbb;
    }
    .legend h2 {
      width: 100%;
      text-align: center;
      font-size: 0.9rem;
      color: #444;
      margin-bottom: 4px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.8rem;
      color: #333;
    }
    .swatch {
      width: 32px;
      height: 32px;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .sw-margin  { background: #e8e8e8; border: 2px dashed #999; }
    .sw-border  { background: #222;    border: 2px solid #555; }
    .sw-border-hl { background: #1a6ef5; border: 2px solid #0a4ec0; }
    .sw-padding { background: #fff;    border: 2px dashed #bbb; }
    .sw-padding-hl { background: #a8d0f5; border: 2px dashed #5599dd; }
    .sw-content { background: #aaa;    border: 2px solid #888; }
  </style>
</head>
